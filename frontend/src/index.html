<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Collector</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #333;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Form Container Styles */
        .form-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 480px;
            margin-bottom: 40px;
        }

        .form-container h2 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 6px;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: #3b82f6;
        }

        .form-group textarea {
            resize: vertical;
            height: 100px;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background-color: #2563eb;
        }

        /* Feedback Grid & Cards */
        .feedback-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        .feedback-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border-left: 4px solid #3b82f6;
            position: relative;
        }

        .feedback-card h3 {
            font-size: 18px;
            color: #1e3a8a;
            margin-bottom: 4px;
        }

        .feedback-card .email {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 12px;
        }

        .feedback-card .message {
            font-size: 15px;
            color: #374151;
        }

        footer {
            margin-top: 50px;
            text-align: center;
            font-size: 13px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <!-- Feedback Form Section -->
    <div class="form-container">
        <h2>Send Us Your Feedback</h2>
        <form id="feedbackForm">
            <div class="form-group">
                <label>Name:</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" placeholder="name@email.com" required>
            </div>
            <div class="form-group">
                <label>Message:</label>
                <textarea id="message" placeholder="Type your message..." required></textarea>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">Submit Feedback</button>
        </form>
    </div>

    <!-- Feedback Display Grid -->
    <div class="feedback-grid" id="feedbackGrid">
        <!-- Dynamic cards will load here via JavaScript -->
    </div>

    <footer>
        © 2026 Feedback Collector | Powered by MERN Stack.
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const API_URL = 'http://localhost:5000/api/feedback';

        // Fetch and display feedbacks (GET)
        async function loadFeedbacks() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                const grid = document.getElementById('feedbackGrid');
                grid.innerHTML = '';

                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'feedback-card';
                    card.innerHTML = `
                        <h3>${item.name}</h3>
                        <div class="email">Email: ${item.email}</div>
                        <div class="message">${item.message}</div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading feedbacks:', error);
            }
        }

        // Handle form submission (POST)
        document.getElementById('feedbackForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, message })
                });

                if (response.ok) {
                    alert('Feedback submitted successfully!');
                    document.getElementById('feedbackForm').reset();
                    loadFeedbacks();
                } else {
                    alert('Failed to submit feedback.');
                }
            } catch (error) {
                console.error('Error submitting feedback:', error);
            }
        });

        // Load feedbacks on page startup
        loadFeedbacks();
    </script>
</body>
</html>
